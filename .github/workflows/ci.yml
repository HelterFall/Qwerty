name: C++ CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DTRANSACTION_ENGINE_BUILD_BENCHMARK=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: CLI smoke test
        shell: bash
        run: |
          actual=$(printf '5\n1 0 10\n1 1 -5\n1 2 20\n2 0 1 5\n3 0 2\n' | ./build/transaction_engine_cli)
          test "$actual" = "35"
      - name: Synthetic benchmark (block size 16)
        run: ./build/transaction_engine_benchmark_16 20000 20000
      - name: Synthetic benchmark (block size 32)
        run: ./build/transaction_engine_benchmark_32 20000 20000
      - name: Synthetic benchmark (block size 64)
        run: ./build/transaction_engine_benchmark_64 20000 20000
      - name: Synthetic benchmark (block size 128)
        run: ./build/transaction_engine_benchmark_128 20000 20000
      - name: Synthetic benchmark (block size 256)
        run: ./build/transaction_engine_benchmark 20000 20000
      - name:       - name:       - name: Larger workload benchmark (100k elements, block size 128)
        run: ./build/transaction_engine_benchmark_128 100000 20000
      - name: Larger workload benchmark (100k elements, block size 256)
        run: ./build/transaction_engine_benchmark 100000 20000
